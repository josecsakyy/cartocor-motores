<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Motores y Lay Out - Cartocor Arroyito</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .blueprint-container {
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 h-full overflow-x-hidden">
    <div id="root" class="h-full flex flex-col"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebaseModules = {
            initializeApp, getAuth, signInAnonymously,
            getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const INITIAL_MOTORS = [
            { id: '1', tag: 'MOT-001', power: '15 HP', rpm: '1450', flange: 'Con brida', location: 'Sala de Máquina', condition: 'En funcionamiento', description: 'Bomba principal de vacío - Máquina de Papel', x: 55, y: 35 },
            { id: '2', tag: 'MOT-002', power: '7.5 HP', rpm: '2900', flange: 'Sin brida', location: 'Depósito', condition: 'Esperando repuesto', description: 'Motor de repuesto para sección húmeda', x: 25, y: 25 },
            { id: '3', tag: 'MOT-003', power: '30 HP', rpm: '980', flange: 'Con brida', location: 'Planta Sector A', condition: 'En reparación', description: 'Ventilador de tiro forzado sector hornos', x: 75, y: 70 },
            { id: '4', tag: 'MOT-004', power: '5 HP', rpm: '1450', flange: 'Sin brida', location: 'Depósito', condition: 'En funcionamiento', description: 'Stock disponible en estantería central', x: 15, y: 65 },
            { id: '5', tag: 'MOT-005', power: '20 HP', rpm: '1450', flange: 'Con brida', location: 'Taller de Mantenimiento', condition: 'Retirado', description: 'Motor fuera de servicio por rebinado', x: 40, y: 80 },
            { id: '6', tag: 'MOT-006', power: '10 HP', rpm: '2900', flange: 'Con brida', location: 'Sala de Máquina', condition: 'En funcionamiento', description: 'Compresor de instrumentación', x: 65, y: 50 }
        ];

        const CONDITION_COLORS = {
            'En funcionamiento': { bg: 'bg-emerald-50', text: 'text-emerald-900', border: 'border-emerald-300', hex: '#78BC1B' },
            'Esperando repuesto': { bg: 'bg-amber-50', text: 'text-amber-900', border: 'border-amber-300', hex: '#d97706' },
            'En reparación': { bg: 'bg-orange-50', text: 'text-orange-900', border: 'border-orange-300', hex: '#ea580c' },
            'Retirado': { bg: 'bg-slate-100', text: 'text-slate-800', border: 'border-slate-300', hex: '#64748b' }
        };

        function App() {
            const [motors, setMotors] = useState(INITIAL_MOTORS);
            const [isFirebaseConnected, setIsFirebaseConnected] = useState(false);
            const [userId, setUserId] = useState(null);
            const [activeTab, setActiveTab] = useState('table');
            const [searchTerm, setSearchTerm] = useState('');
            const [filterLocation, setFilterLocation] = useState('Todos');
            const [filterCondition, setFilterCondition] = useState('Todas');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingMotor, setEditingMotor] = useState(null);
            const [formData, setFormData] = useState({
                tag: '', power: '', rpm: '', flange: 'Con brida', location: 'Depósito', condition: 'En funcionamiento', description: '', x: 50, y: 50
            });
            const [toast, setToast] = useState(null);
            const [modalMessage, setModalMessage] = useState(null);
            const [deleteTargetId, setDeleteTargetId] = useState(null);

            useEffect(() => {
                const initFirebase = async () => {
                    if (!window.firebaseModules) {
                        setTimeout(initFirebase, 200);
                        return;
                    }
                    const { initializeApp, getAuth, signInAnonymously, getFirestore, collection, onSnapshot, setDoc, doc } = window.firebaseModules;
                    const firebaseConfig = {
                        apiKey: "AIzaSyD6EQxG6wldQdPo6CDEnHDVc_gWbq5fUaI",
                        authDomain: "cartocor-motores.firebaseapp.com",
                        projectId: "cartocor-motores",
                        storageBucket: "cartocor-motores.firebasestorage.app",
                        messagingSenderId: "924232630993",
                        appId: "1:924232630993:web:dbeadf5357dfce00643bf0",
                        measurementId: "G-LQN3XLL2L1"
                    };
                    const appId = 'cartocor-motors-production';
                    try {
                        const app = initializeApp(firebaseConfig);
                        const db = getFirestore(app);
                        const auth = getAuth(app);
                        await signInAnonymously(auth);
                        if (auth.currentUser) setUserId(auth.currentUser.uid);
                        const motorsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'motors_list');
                        onSnapshot(motorsCollection, async (snapshot) => {
                            if (snapshot.empty) {
                                for (const m of INITIAL_MOTORS) {
                                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'motors_list', m.id), m);
                                }
                            } else {
                                const loaded = [];
                                snapshot.forEach(docSnap => loaded.push({ id: docSnap.id, ...docSnap.data() }));
                                setMotors(loaded);
                                setIsFirebaseConnected(true);
                            }
                        }, (err) => {
                            console.error(err);
                            const saved = localStorage.getItem('cartocor_motors_v3');
                            if (saved) setMotors(JSON.parse(saved));
                        });
                    } catch (e) {
                        console.error(e);
                        const saved = localStorage.getItem('cartocor_motors_v3');
                        if (saved) setMotors(JSON.parse(saved));
                    }
                };
                initFirebase();
            }, []);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [motors, activeTab, isModalOpen, modalMessage, deleteTargetId, isFirebaseConnected]);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            };

            const stats = useMemo(() => ({
                total: motors.length,
                depotStock: motors.filter(m => m.location === 'Depósito' && m.condition === 'En funcionamiento').length,
                inPlant: motors.filter(m => m.location !== 'Depósito').length,
                repairingOrWaiting: motors.filter(m => m.condition === 'En reparación' || m.condition === 'Esperando repuesto').length
            }), [motors]);

            const filteredMotors = useMemo(() => motors.filter(m => {
                const matchesSearch = m.tag.toLowerCase().includes(searchTerm.toLowerCase()) || m.description.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesLoc = filterLocation === 'Todos' || m.location === filterLocation;
                const matchesCond = filterCondition === 'Todas' || m.condition === filterCondition;
                return matchesSearch && matchesLoc && matchesCond;
            }), [motors, searchTerm, filterLocation, filterCondition]);

            return (
                <div className="flex flex-col h-full bg-slate-50 text-slate-900 min-h-screen">
                    <header className="bg-white border-b border-slate-200 px-6 py-3.5 flex flex-col md:flex-row justify-between items-center gap-4 shadow-sm shrink-0">
                        <div className="flex items-center gap-4">
                            <svg viewBox="0 0 280 65" className="h-11 w-auto" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <g transform="translate(2, 2)">
                                    <path d="M42 8C35 4 25 3 17 8C7 14 2 25 4 37C6 48 15 56 27 57C36 57 44 53 49 48" stroke="#6E6E6E" strokeWidth="6.5" strokeLinecap="round"/>
                                    <path d="M30 14C35 15 42 20 44 26C46 32 38 38 42 44" stroke="#78BC1B" strokeWidth="5.5" strokeLinecap="round" fill="none"/>
                                    <path d="M22 18C27 21 34 26 33 33" stroke="#78BC1B" strokeWidth="4.5" strokeLinecap="round" fill="none"/>
                                </g>
                                <text x="70" y="42" fontFamily="'Inter', sans-serif" fontWeight="900" fontSize="28" fill="#6E6E6E">CARTOCOR</text>
                            </svg>
                            <div className="hidden sm:block border-l border-slate-300 pl-4">
                                <div className="flex items-center gap-2">
                                    <span className="text-xs font-bold uppercase tracking-wider text-slate-500">Arroyito CBA - Planta Papel</span>
                                    <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold ${isFirebaseConnected ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600'}`}>
                                        <span className={`w-1.5 h-1.5 rounded-full ${isFirebaseConnected ? 'bg-emerald-600 animate-pulse' : 'bg-slate-400'}`}></span>
                                        {isFirebaseConnected ? 'Nube Sincronizada' : 'Modo Local'}
                                    </span>
                                </div>
                                <h1 className="text-sm font-black text-slate-900">Gestión de Motores y Lay Out Operativo</h1>
                            </div>
                        </div>
                        <div className="flex items-center gap-3">
                            <div className="bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-xl text-xs">Total: <strong className="text-slate-900">{stats.total}</strong></div>
                            <div className="bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-xl text-xs">Depósito: <strong className="text-slate-900">{stats.depotStock}</strong></div>
                            <div className="bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-xl text-xs">En Planta: <strong className="text-slate-900">{stats.inPlant}</strong></div>
                        </div>
                    </header>

                    <div className="bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center shrink-0">
                        <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
                            <button onClick={() => setActiveTab('table')} className={`px-4 py-2 rounded-lg text-sm font-semibold ${activeTab === 'table' ? 'bg-slate-900 text-white' : 'text-slate-600'}`}>Registro (Tabla)</button>
                            <button onClick={() => setActiveTab('plan')} className={`px-4 py-2 rounded-lg text-sm font-semibold ${activeTab === 'plan' ? 'bg-slate-900 text-white' : 'text-slate-600'}`}>Plano Lay Out Interactivo</button>
                        </div>
                        <button onClick={() => { setEditingMotor(null); setFormData({ tag: `MOT-00${motors.length+1}`, power: '10 HP', rpm: '1450', flange: 'Con brida', location: 'Depósito', condition: 'En funcionamiento', description: '', x: 50, y: 50 }); setIsModalOpen(true); }} className="bg-[#78BC1B] text-white font-bold px-5 py-2 rounded-xl text-sm">Agregar Motor</button>
                    </div>

                    <main className="flex-1 p-6 overflow-y-auto">
                        {activeTab === 'table' ? (
                            <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                                <table className="w-full text-left text-sm">
                                    <thead>
                                        <tr className="bg-slate-900 text-white uppercase text-xs">
                                            <th className="py-3 px-4">Tag</th>
                                            <th className="py-3 px-4">Potencia</th>
                                            <th className="py-3 px-4">RPM</th>
                                            <th className="py-3 px-4">Área</th>
                                            <th className="py-3 px-4">Condición</th>
                                            <th className="py-3 px-4">Descripción</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-200">
                                        {filteredMotors.map(m => (
                                            <tr key={m.id} className="hover:bg-slate-50">
                                                <td className="py-3 px-4 font-bold">{m.tag}</td>
                                                <td className="py-3 px-4">{m.power}</td>
                                                <td className="py-3 px-4">{m.rpm}</td>
                                                <td className="py-3 px-4">{m.location}</td>
                                                <td className="py-3 px-4">{m.condition}</td>
                                                <td className="py-3 px-4 text-xs text-slate-600">{m.description}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        ) : (
                            <div className="blueprint-container bg-white border border-slate-300 rounded-2xl relative h-[650px] shadow-inner overflow-hidden flex items-center justify-center">
                                <div className="absolute inset-0 opacity-20 border-8 border-dashed border-slate-400 m-4 flex flex-col justify-between p-8 pointer-events-none">
                                    <div className="flex justify-between font-bold text-lg text-slate-700"><span>DEPÓSITO / PAÑOL</span><span>SALA DE MÁQUINA PAPEL</span></div>
                                    <div className="flex justify-between font-bold text-lg text-slate-700"><span>TALLER DE MANTENIMIENTO</span><span>PLANTA SECTOR A</span></div>
                                </div>
                                {motors.map(m => {
                                    const cStyle = CONDITION_COLORS[m.condition] || CONDITION_COLORS['Retirado'];
                                    return (
                                        <div key={m.id} style={{ left: `${m.x}%`, top: `${m.y}%` }} className="absolute -translate-x-1/2 -translate-y-1/2 cursor-pointer z-20">
                                            <div className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl shadow-lg border bg-white ${cStyle.border}`}>
                                                <span className="w-3 h-3 rounded-full animate-pulse" style={{ backgroundColor: cStyle.hex }}></span>
                                                <span className="font-bold text-xs">{m.tag}</span>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </main>

                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl">
                                <h3 className="font-bold text-lg mb-4">Registrar Nuevo Motor</h3>
                                <form onSubmit={async (e) => {
                                    e.preventDefault();
                                    const newId = Date.now().toString();
                                    const db = window.firebaseModules.getFirestore();
                                    await window.firebaseModules.setDoc(window.firebaseModules.doc(db, 'artifacts', 'cartocor-motors-production', 'public', 'data', 'motors_list', newId), { ...formData, id: newId });
                                    setIsModalOpen(false);
                                    showToast('Motor guardado correctamente');
                                }} className="space-y-3">
                                    <input type="text" placeholder="Tag (Ej. MOT-007)" value={formData.tag} onChange={e=>setFormData({...formData, tag:e.target.value})} className="w-full border p-2 rounded-xl text-sm" required />
                                    <input type="text" placeholder="Potencia (Ej. 15 HP)" value={formData.power} onChange={e=>setFormData({...formData, power:e.target.value})} className="w-full border p-2 rounded-xl text-sm" />
                                    <select value={formData.location} onChange={e=>setFormData({...formData, location:e.target.value})} className="w-full border p-2 rounded-xl text-sm">
                                        <option value="Depósito">Depósito</option>
                                        <option value="Sala de Máquina">Sala de Máquina</option>
                                        <option value="Planta Sector A">Planta Sector A</option>
                                        <option value="Taller de Mantenimiento">Taller de Mantenimiento</option>
                                    </select>
                                    <textarea placeholder="Descripción" value={formData.description} onChange={e=>setFormData({...formData, description:e.target.value})} className="w-full border p-2 rounded-xl text-sm"></textarea>
                                    <div className="flex justify-end gap-2 pt-2">
                                        <button type="button" onClick={()=>setIsModalOpen(false)} className="px-4 py-2 bg-slate-100 rounded-xl text-sm">Cancelar</button>
                                        <button type="submit" className="px-4 py-2 bg-slate-900 text-white rounded-xl text-sm">Guardar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
